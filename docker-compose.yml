# Production-shape stack. Dev: `docker compose up`.
# Services:
#   postgres   TimescaleDB-flavored Postgres (prices_daily becomes a hypertable)
#   redis      Job queue + cache
#   api        FastAPI (uvicorn), on loopback port 8701
#   worker     RQ worker for backtests / ingest jobs
#   scheduler  NSE close jobs and PostgreSQL outbox reconciliation
#   object-store  S3-compatible storage for raw payloads and backtest JSON
#   tempo      Local OTLP/HTTP trace storage and query API
#
# Secrets come from .env at the repo root (never committed).

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: stock_agents_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-stockagents}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-devpassword}
      POSTGRES_DB: ${PG_DB:-stockagents}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/sql/timescale.sql:/docker-entrypoint-initdb.d/02-timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stock_agents_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-store:
    image: chrislusf/seaweedfs:4.54
    container_name: stock_agents_object_store
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-stockagents-dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-stockagents-dev-secret}
      S3_BUCKET: stock-agents
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_agents_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-store:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-stockagents}:${PG_PASSWORD:-devpassword}@postgres:5432/${PG_DB:-stockagents}
      REDIS_URL: redis://redis:6379/0
      AUTH_RATE_LIMIT_STORAGE_URL: ${AUTH_RATE_LIMIT_STORAGE_URL:-redis://redis:6379/1}
      S3_ENDPOINT: http://object-store:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      S3_BUCKET: stock-agents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stockagents-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-stockagents-dev-secret}
      PYTHONUNBUFFERED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
    env_file: .env
    ports:
      - "127.0.0.1:8701:8701"
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./backtests:/app/backtests
    command:
      - sh
      - -c
      - >-
        python -m alembic upgrade head &&
        python -c 'from stock_agents.storage.s3 import ensure_bucket; ensure_bucket()' &&
        exec uvicorn stock_agents.api.main:app --host 0.0.0.0 --port 8701 --proxy-headers

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_agents_worker
    restart: unless-stopped
    stop_grace_period: 2h5m
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-store:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-stockagents}:${PG_PASSWORD:-devpassword}@postgres:5432/${PG_DB:-stockagents}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://object-store:9000
      S3_BUCKET: stock-agents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stockagents-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-stockagents-dev-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
    env_file: .env
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./backtests:/app/backtests
    healthcheck:
      disable: true
    command: python -m stock_agents.jobs.worker

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-stockagents}:${PG_PASSWORD:-devpassword}@postgres:5432/${PG_DB:-stockagents}
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_RUN_MARKET_JOBS: ${SCHEDULER_RUN_MARKET_JOBS:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
    env_file: .env
    healthcheck:
      disable: true
    command: python -m scripts.schedule_daily

  tempo:
    image: grafana/tempo:2.9.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"

volumes:
  pgdata:
  redisdata:
  objectdata:
