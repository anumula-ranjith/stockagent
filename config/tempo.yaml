server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4318

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: ./logs/tempo/wal
    local:
      path: ./logs/tempo/blocks
