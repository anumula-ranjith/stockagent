# Project-wide settings. Secrets live in .env, never here.

paths:
  data_dir: data
  raw_dir:  data/raw          # gzipped raw API payloads, keyed by {source}/{endpoint}/{date}
  duckdb:   data/market.duckdb
  backtests_dir: backtests
  log_dir:  logs
  fixtures_dir: tests/fixtures

timezone: Asia/Kolkata
market_calendar: XNSE          # pandas_market_calendars (NSE India)
exchange_suffix: ".NSE"        # EODHD ticker suffix for NSE India
base_currency: INR

schedule:
  # All times in IST. NSE trades 09:15–15:30 IST.
  daily_data_et:         "17:00"   # after NSE close + settlement window
  daily_signals_et:      "18:00"
  execute_orders_et:     "09:10"   # pre-open on next trading day
  mark_to_market_et:     "15:45"
  weekly_fundamentals_et:
    day: Saturday
    time: "09:00"
  retry_data_until_et:   "20:00"
  retry_interval_min:    15

costs:
  commission_bps:  0.0
  slippage_bps:    5.0
  short_borrow_annual: 0.005
  min_trade_size_usd: 100.0

universe:
  mode: seed_csv               # seed_csv | factset_constituents
  benchmark_constituents: "NIFTY200"
  seed_csv: config/universe_seed.csv
  rebalance_check: monthly

data:
  price_lookback_years: 10
  news_lookback_days: 30
  survivorship_bias_flag_in_backtest: true

alerts:
  on_blocking_failure: true
  on_source_outage: false

logging:
  level: INFO
  file_rotation_mb: 50
  retention_count: 10
