# Project-wide settings. Secrets live in .env, never here.

paths:
  data_dir: data
  raw_dir:  data/raw          # gzipped raw API payloads, keyed by {source}/{endpoint}/{date}
  duckdb:   data/market.duckdb
  backtests_dir: backtests
  log_dir:  logs
  fixtures_dir: tests/fixtures

timezone: America/New_York
market_calendar: XNYS          # pandas_market_calendars

schedule:
  daily_data_et:         "18:30"   # after US close + settlement window
  daily_signals_et:      "19:30"
  execute_orders_et:     "09:25"   # next trading day
  mark_to_market_et:     "16:15"
  weekly_fundamentals_et:
    day: Saturday
    time: "09:00"
  retry_data_until_et:   "21:00"
  retry_interval_min:    15

costs:
  commission_bps:  0.0
  slippage_bps:    5.0
  short_borrow_annual: 0.005
  min_trade_size_usd: 100.0

universe:
  mode: factset_constituents   # factset_constituents | seed_csv
  benchmark_constituents: "SP100"
  seed_csv: config/universe_seed.csv
  rebalance_check: monthly

data:
  price_lookback_years: 10
  news_lookback_days: 30
  survivorship_bias_flag_in_backtest: true

alerts:
  on_blocking_failure: true
  on_source_outage: false

logging:
  level: INFO
  file_rotation_mb: 50
  retention_count: 10
