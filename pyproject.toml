[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-agents"
version = "0.1.0"
description = "Four-agent ranking, portfolio and backtesting system for US large caps."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pandas-ta>=0.3.14b",
  "duckdb>=1.0",
  "pyarrow>=15",
  "pyyaml>=6",
  "pydantic>=2.5",
  "python-dotenv>=1",
  "requests>=2.31",
  "tenacity>=8.2",
  "pandas_market_calendars>=4.4",
  "apscheduler>=3.10",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "streamlit>=1.31",
  "plotly>=5.18",
  "matplotlib>=3.8",
  # External brokers / vendors (optional at import time; see sources/*.py):
  #   alpaca-py, fds.sdk.FactSetFundamentals, fds.sdk.FactSetEstimates,
  #   fds.sdk.FactSetPrices, fds.sdk.FactSetOwnership, fds.sdk.Symbology,
  #   fds.sdk.EventsandTranscripts, fds.sdk.utils
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "black>=24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # black handles line length

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
