[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-agents"
version = "0.1.0"
description = "Four-agent ranking, portfolio and backtesting system for US large caps."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pandas-ta>=0.3.14b",
  "pyarrow>=15",
  "pyyaml>=6",
  "pydantic>=2.5",
  "python-dotenv>=1",
  "requests>=2.31",
  "httpx>=0.27",
  "tenacity>=8.2",
  "pandas_market_calendars>=4.4",
  "apscheduler>=3.10,<4",
  "fastapi>=0.110",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pyjwt[crypto]>=2.10",
  "pwdlib[argon2,bcrypt]>=0.2",
  "email-validator>=2.0",
  "slowapi>=0.1.9",
  "redis>=5.2",
  "rq>=2.8,<4",
  "celery[redis]>=5.5,<6",
  "rq-dashboard>=0.9.1,<1",
  "a2wsgi>=1.10",
  "boto3>=1.35",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "opentelemetry-sdk>=1.31",
  "opentelemetry-exporter-otlp-proto-http>=1.31",
  "uvicorn>=0.27",
  "websockets>=13",
  "plotly>=5.18",
  "matplotlib>=3.8",
  # External brokers / vendors (optional at import time; see sources/*.py):
  #   alpaca-py, fds.sdk.FactSetFundamentals, fds.sdk.FactSetEstimates,
  #   fds.sdk.FactSetPrices, fds.sdk.FactSetOwnership, fds.sdk.Symbology,
  #   fds.sdk.EventsandTranscripts, fds.sdk.utils
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "black>=24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # black handles line length

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
files = [
  "src/stock_agents/common/logging.py",
  "src/stock_agents/common/telemetry.py",
  "src/stock_agents/storage/tracing.py",
  "src/stock_agents/storage/metrics.py",
  "src/stock_agents/api/diagnostics.py",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
