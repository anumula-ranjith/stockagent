name: CI

on:
  push:
    branches: [main, 'codex/phase-6-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      TEST_DATABASE_URL: postgresql://stockagents:ci-database-password@127.0.0.1:5432/stockagents
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Start native PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE stockagents WITH LOGIN CREATEDB PASSWORD 'ci-database-password'"
          sudo -u postgres createdb -O stockagents stockagents
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src scripts tests
      - run: python -m mypy
      - run: python -m pytest
      - name: Smoke-test native services and a private backtest artifact
        env:
          DATABASE_URL: postgresql://stockagents:ci-database-password@127.0.0.1:5432/stockagents
          AUTH_COOKIE_SECURE: 'false'
          REDIS_URL: redis://127.0.0.1:6379/0
          S3_BUCKET: stock-agents-ci
          S3_ENDPOINT: http://127.0.0.1:9002
          S3_PUBLIC_ENDPOINT: http://127.0.0.1:9002
          S3_ACCESS_KEY: native-ci-service
          SCHEDULER_RUN_MARKET_JOBS: 'false'
        run: bash scripts/ci_native_smoke.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
