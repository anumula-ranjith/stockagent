services:
  - type: web
    name: stock-agents-api
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    preDeployCommand: python -m alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: '8701'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_RATE_LIMIT_STORAGE_URL
        sync: false
      - key: AUTH_PROVIDER
        value: jwt
      - key: AUTH_COOKIE_SECURE
        value: 'true'
      - key: REQUIRE_MARKET_DATA_AUTH
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_SIGNUP_TOKEN
        generateValue: true
      - key: METRICS_BEARER_TOKEN
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: stock-agents-rq
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: 'off'
    dockerCommand: python -m stock_agents.jobs.worker
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: EODHD_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: stock-agents-scheduler
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: 'off'
    dockerCommand: python -m scripts.schedule_daily
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: EODHD_API_KEY
        sync: false
