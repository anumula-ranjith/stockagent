<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four-Agent Stock Ranker (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --ink:#15202C; --muted:#5A6676; --line:#D4DBE3; --soft:#E4E9EF;
  --accent:#1F4E79; --long:#1A7547; --short:#AE3628; --bench:#8A96A5;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171E; --panel:#19212A; --ink:#E5EBF1; --muted:#93A1B1; --line:#2B3641; --soft:#222C37;
    --accent:#86B4E0; --long:#52C089; --short:#E8796B; --bench:#6F7C8B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171E; --panel:#19212A; --ink:#E5EBF1; --muted:#93A1B1; --line:#2B3641; --soft:#222C37;
  --accent:#86B4E0; --long:#52C089; --short:#E8796B; --bench:#6F7C8B; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.45;font-variant-numeric:tabular-nums}
header{padding:20px 24px 0;max-width:1320px;margin:0 auto}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);margin:4px 0 14px;max-width:72ch}
.sim{display:inline-block;border:1px solid var(--short);color:var(--short);border-radius:4px;padding:1px 7px;font-size:12.5px;font-weight:600;margin-left:6px;vertical-align:2px}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{font:inherit;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1320px;margin:0 auto;padding:18px 24px 40px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
aside h2{font-size:15px;margin:2px 0 4px}
aside p.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
aside h3{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.frow{display:grid;grid-template-columns:18px 1fr 44px;align-items:center;gap:6px;padding:4px 0}
.frow label{font-size:13.5px}
.frow .pct{font-size:12.5px;color:var(--muted);text-align:right}
.frow input[type=range]{grid-column:2 / 4;width:100%;margin:0;accent-color:var(--accent)}
.frow.off label,.frow.off .pct{opacity:.45}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}
.ctl input[type=number]{width:72px;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.ctl select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);max-width:160px}
.preset{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:5px;padding:6px 10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.content{min-width:0}
.lead{margin:0 0 14px;max-width:80ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:600;color:var(--muted);text-align:right;padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 7px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td.tk{font-weight:700}
td.sec{color:var(--muted)}
tr.fail td{opacity:.5}
.pos{color:var(--long)} .neg{color:var(--short)}
.sb{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.sb span{width:64px;height:7px;background:var(--soft);border-radius:4px;overflow:hidden;display:inline-block}
.sb i{display:block;height:100%;background:var(--accent)}
.sb b{min-width:24px;text-align:right}
.agents{display:inline-flex;gap:3px;align-items:flex-end;height:22px}
.agents i{width:9px;background:var(--accent);border-radius:2px 2px 0 0;display:block}
.agents.short i{background:var(--short)}
.agents.long i{background:var(--long)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;margin-right:6px;vertical-align:middle;background:var(--c)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.m{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.m small{display:block;color:var(--muted);font-size:12.5px}
.m strong{font-size:20px;font-weight:700}
.m em{font-style:normal;color:var(--muted);font-size:12.5px;display:block}
.heat{display:grid;grid-template-columns:120px 1fr 54px;gap:6px;align-items:center;font-size:13px;padding:2px 0}
.heat .b{height:9px;position:relative;background:var(--soft);border-radius:4px}
.heat .b i{position:absolute;top:0;bottom:0;border-radius:4px}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.stack>*+*{margin-top:16px}
@media (max-width:900px){
  main{grid-template-columns:1fr;padding:14px}
  aside{position:static;max-height:none}
  header{padding:16px 14px 0}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Four-agent stock ranker</h1>
  <p class="sub">Technical, sentiment, momentum and fundamental agents each rank 100 US large caps. Adjust any weight and the rankings, the long/short list and the backtest update. <span class="sim">Simulated data</span></p>
  <nav role="tablist" id="tabs"></nav>
</header>
<main>
  <aside id="side"></aside>
  <section class="content" id="view"></section>
</main>
<script>
/* ---------- Universe ---------- */
const UNIV = {
  "Technology":"AAPL MSFT NVDA AVGO ORCL CRM ADBE AMD INTC CSCO QCOM TXN IBM NOW INTU AMAT MU PANW ADI LRCX KLAC",
  "Communication":"GOOGL META NFLX DIS CMCSA T VZ TMUS CHTR",
  "Consumer Disc.":"AMZN TSLA HD MCD NKE SBUX LOW BKNG TJX TGT",
  "Consumer Staples":"WMT COST PG KO PEP PM MDLZ CL",
  "Financials":"JPM BAC WFC GS MS C BLK SCHW AXP V MA BRK-B SPGI PYPL CB",
  "Health Care":"UNH JNJ LLY MRK ABBV PFE TMO ABT DHR AMGN GILD ISRG CVS MDT BMY",
  "Industrials":"CAT DE HON GE UPS RTX LMT BA UNP MMM ETN ADP",
  "Energy":"XOM CVX COP SLB",
  "Utilities":"NEE DUK SO",
  "Real Estate":"AMT PLD",
  "Materials":"LIN"
};
const SECTORS = Object.keys(UNIV);

/* ---------- Seeded random ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20261117);
function randn(){let u=0;while(!u)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd())}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------- Dates ---------- */
const D = 760;
const DATES = (()=>{const out=[];const d=new Date(Date.UTC(2026,10,16));while(out.length<D){const w=d.getUTCDay();if(w!==0&&w!==6)out.push(new Date(d));d.setUTCDate(d.getUTCDate()-1)}return out.reverse()})();
const fmtDate=d=>d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});

/* ---------- Indicator helpers ---------- */
const F=n=>new Float64Array(n).fill(NaN);
function sma(a,n){const o=F(a.length);let s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];if(i>=n-1)o[i]=s/n}return o}
function ema(a,n){const o=new Float64Array(a.length);const k=2/(n+1);o[0]=a[0];for(let i=1;i<a.length;i++)o[i]=a[i]*k+o[i-1]*(1-k);return o}
function rstd(a,n){const o=F(a.length);let s=0,q=0;for(let i=0;i<a.length;i++){s+=a[i];q+=a[i]*a[i];if(i>=n){s-=a[i-n];q-=a[i-n]*a[i-n]}if(i>=n-1){const m=s/n;o[i]=Math.sqrt(Math.max(q/n-m*m,0))}}return o}
function rmax(a,n){const o=F(a.length);for(let i=n-1;i<a.length;i++){let m=-Infinity;for(let j=i-n+1;j<=i;j++)if(a[j]>m)m=a[j];o[i]=m}return o}
function rmin(a,n){const o=F(a.length);for(let i=n-1;i<a.length;i++){let m=Infinity;for(let j=i-n+1;j<=i;j++)if(a[j]<m)m=a[j];o[i]=m}return o}
function rsiCalc(c,n=14){const o=F(c.length);let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],up=Math.max(d,0),dn=Math.max(-d,0);if(i<=n){g+=up/n;l+=dn/n}else{g=(g*(n-1)+up)/n;l=(l*(n-1)+dn)/n}if(i>=n)o[i]=100-100/(1+g/(l||1e-9))}return o}
function atrAdx(h,l,c,n=14){const L=c.length,atr=F(L),adx=F(L);let tr=0,p=0,m=0,ad=NaN,dxs=[];for(let i=1;i<L;i++){const t=Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1]));const up=h[i]-h[i-1],dn=l[i-1]-l[i];const pd=(up>dn&&up>0)?up:0,md=(dn>up&&dn>0)?dn:0;if(i<=n){tr+=t;p+=pd;m+=md}else{tr=tr-tr/n+t;p=p-p/n+pd;m=m-m/n+md}if(i>=n){atr[i]=tr/n;const pdi=100*p/tr,mdi=100*m/tr,dx=100*Math.abs(pdi-mdi)/((pdi+mdi)||1e-9);if(isNaN(ad)){dxs.push(dx);if(dxs.length===n)ad=dxs.reduce((s,x)=>s+x,0)/n}else ad=(ad*(n-1)+dx)/n;if(!isNaN(ad))adx[i]=ad*(pdi>=mdi?1:-1)}}return{atr,adx}}

/* ---------- Simulate market ---------- */
const S=[];
(function simulate(){
  const sd={};SECTORS.forEach(s=>sd[s]=0);
  const mkt=[],secR={};SECTORS.forEach(s=>secR[s]=[]);
  for(let t=0;t<D;t++){mkt.push(0.00035+0.0095*randn());SECTORS.forEach(s=>{sd[s]=0.985*sd[s]+0.00009*randn();secR[s].push(sd[s]+0.0055*randn())})}
  SECTORS.forEach(sec=>UNIV[sec].split(" ").forEach(tk=>{
    const beta=0.7+0.7*rnd(),iv=0.008+0.012*rnd();let mu=0.0007*randn(),p=40+400*rnd();
    const c=new Float64Array(D),h=new Float64Array(D),l=new Float64Array(D),v=new Float64Array(D),r=new Float64Array(D),muA=new Float64Array(D);
    const baseV=1e6*(2+30*rnd());
    for(let t=0;t<D;t++){mu=0.985*mu+0.00012*randn();const ret=t?beta*mkt[t]+secR[sec][t]+mu+iv*randn():0;p*=1+ret;
      c[t]=p;r[t]=ret;muA[t]=mu;const span=iv*0.7;h[t]=p*(1+Math.abs(randn())*span);l[t]=p*(1-Math.abs(randn())*span);
      v[t]=baseV*Math.exp(0.25*randn())*(1+40*Math.abs(ret))}
    // sentiment series
    const news=new Float64Array(D),cnt=new Float64Array(D),ana=new Float64Array(D),soc=new Float64Array(D);let ns=0,an=0,so=0;
    for(let t=0;t<D;t++){ns=0.85*ns+0.15*(muA[t]*900+0.7*randn());news[t]=Math.tanh(ns);
      cnt[t]=Math.max(0,Math.round(2+1.5*randn()+Math.abs(r[t])*180));an=0.95*an+0.05*(muA[t]*1400+randn());ana[t]=an;
      so=0.8*so+0.2*(randn()+(t>5?(c[t]/c[t-5]-1)*25:0));soc[t]=so}
    const cumCnt=new Float64Array(D);for(let t=0;t<D;t++)cumCnt[t]=(t?cumCnt[t-1]:0)+cnt[t];
    // fundamentals (static, loosely tied to long-run drift)
    const q=muA[D-1]*900+randn()*0.8;
    const basePE={"Technology":30,"Communication":22,"Consumer Disc.":26,"Consumer Staples":22,"Financials":14,"Health Care":20,"Industrials":21,"Energy":12,"Utilities":18,"Real Estate":32,"Materials":27}[sec];
    let pe=basePE*Math.exp(0.35*randn()+0.1*q);if(rnd()<0.04)pe=-(5+20*rnd());
    const revG=0.06+0.06*q+0.06*randn(),epsG=revG*1.3+0.06*randn();
    const fund={pe,fpe:pe>0?pe/(1+Math.max(-0.3,epsG)):pe,pb:Math.exp(1.2+0.6*randn()),ev:Math.max(4,basePE*0.65*Math.exp(0.3*randn())),ps:Math.exp(1.3+0.7*randn()),
      fcfy:Math.max(-0.02,0.04+0.02*randn()+0.005*q),peg:pe>0?pe/Math.max(1,epsG*100):99,
      roe:0.16+0.08*q+0.06*randn(),roic:0.12+0.06*q+0.04*randn(),gm:clamp(0.45+0.15*randn()+0.04*q,0.1,0.9),om:clamp(0.2+0.08*randn()+0.03*q,-0.05,0.6),nm:clamp(0.14+0.07*randn()+0.03*q,-0.1,0.5),
      revG,epsG,surp:0.03+0.04*randn()+0.01*q,fepsG:0.08+0.05*q+0.05*randn(),
      de:Math.max(0.05,(sec==="Financials"||sec==="Utilities"?1.6:0.7)*Math.exp(0.5*randn())),cr:Math.max(0.5,1.4+0.5*randn()),ic:Math.max(1,12*Math.exp(0.6*randn()+0.2*q)),
      fsc:clamp(Math.round(5+1.5*randn()+q),0,9),shy:Math.max(0,0.025+0.015*randn())};
    const ind={sma50:sma(c,50),sma200:sma(c,200),rsi:rsiCalc(c)};
    const e12=ema(c,12),e26=ema(c,26),mac=e12.map((x,i)=>x-e26[i]),sig=ema(mac,9);ind.macd=mac.map((x,i)=>(x-sig[i])/c[i]);
    const m20=sma(c,20),s20=rstd(c,20);ind.bb=c.map((x,i)=>(x-(m20[i]-2*s20[i]))/(4*s20[i]||1));
    const hh=rmax(h,14),ll=rmin(l,14);ind.stoch=sma(c.map((x,i)=>i<13?50:100*(x-ll[i])/((hh[i]-ll[i])||1)),3);
    const aa=atrAdx(h,l,c);ind.atr=aa.atr.map((x,i)=>x/c[i]);ind.adx=aa.adx;
    const v5=sma(v,5),v50=sma(v,50);ind.volr=v5.map((x,i)=>x/v50[i]);
    const obv=new Float64Array(D);for(let t=1;t<D;t++)obv[t]=obv[t-1]+Math.sign(c[t]-c[t-1])*v[t];ind.obv=obv.map((x,i)=>i<20?NaN:(x-obv[i-20])/(v50[i]*20));
    ind.hi52=c.map((x,i)=>i<251?NaN:x);const mx=rmax(c,252);ind.hi52=c.map((x,i)=>x/mx[i]);
    ind.sd21=rstd(r,21);ind.sd63=rstd(r,63);ind.sd126=rstd(r,126);ind.sd252=rstd(r,252);
    S.push({tk,sec,c,r,ind,news,cumCnt,ana,soc,ins:rnd()<0.6?0:(randn()*0.0006),short:0.01+0.07*rnd()*rnd(),fund});
  }));
})();
const N=S.length;
const MKT=new Float64Array(D);for(let t=1;t<D;t++){let s=0;for(const x of S)s+=x.r[t];MKT[t]=s/N}
const ret=(s,t,L)=>s.c[t]/s.c[t-L]-1;
function sectorHeat(t){const o={};SECTORS.forEach(sec=>{const m=S.filter(s=>s.sec===sec);o[sec]=m.reduce((a,s)=>a+ret(s,t,20),0)/m.length});return o}

/* ---------- Scoring helpers ---------- */
function pct(vals,inv,groups){const out=new Float64Array(vals.length).fill(50);const buckets={};vals.forEach((v,i)=>{const g=groups?groups[i]:"_";(buckets[g]=buckets[g]||[]).push(i)});
  for(const g in buckets){const idx=buckets[g].filter(i=>isFinite(vals[i]));idx.sort((a,b)=>vals[a]-vals[b]);const n=idx.length;idx.forEach((i,r)=>{const p=n>1?100*r/(n-1):50;out[i]=inv?100-p:p})}return out}
function zsc(vals,inv){const f=vals.filter(isFinite);const m=f.reduce((a,b)=>a+b,0)/f.length;const sd=Math.sqrt(f.reduce((a,b)=>a+(b-m)**2,0)/f.length)||1;return vals.map(v=>{if(!isFinite(v))return 50;let z=clamp((v-m)/sd,-3,3);if(inv)z=-z;return (z+3)/6*100})}
function shaped(vals,peak,span){return vals.map(v=>isFinite(v)?Math.max(0,100*(1-Math.abs(v-peak)/span)):50)}
function blend(defs,cfg,scores){const tot=new Float64Array(N);let w=0;defs.forEach(d=>{const c=cfg.f[d.k];if(c.on&&c.w>0){w+=c.w;scores[d.k].forEach((x,i)=>tot[i]+=c.w*x)}});return w?Array.from(tot,x=>x/w):Array(N).fill(50)}

/* ---------- Agent definitions ---------- */
const TECH=[
 {k:"rsi",l:"RSI (14)",w:5},{k:"macd",l:"MACD histogram",w:5},{k:"sma50",l:"Price vs 50-day avg",w:5},{k:"sma200",l:"Price vs 200-day avg",w:5},
 {k:"golden",l:"Golden cross",w:3},{k:"adx",l:"Trend strength (ADX)",w:5},{k:"bb",l:"Bollinger %B",w:3},{k:"stoch",l:"Stochastic %K",w:3},
 {k:"volr",l:"Volume surge",w:5},{k:"obv",l:"On-balance volume trend",w:5},{k:"atr",l:"Low volatility (ATR %)",w:3},{k:"hi52",l:"Near 52-week high",w:5}];
const SENT=[
 {k:"news",l:"News tone (7-day)",w:8},{k:"buzz",l:"News volume vs normal",w:3},{k:"sector",l:"Hot sector",w:6},{k:"ana",l:"Analyst revisions",w:5},
 {k:"soc",l:"Social buzz",w:3},{k:"ins",l:"Insider buying",w:3},{k:"short",l:"Short interest",w:3}];
const MOM=[
 {k:"r21",l:"1-month return",w:3},{k:"r63",l:"3-month return",w:6},{k:"r126",l:"6-month return",w:7},{k:"r12",l:"12-1 month return",w:9},
 {k:"rs",l:"Strength vs market (3M)",w:3},{k:"acc",l:"Acceleration",w:2}];
const FUND=[
 {p:"Value",w:25,fs:[["pe","P/E",1],["fpe","Forward P/E",1],["pb","Price/book",1],["ev","EV/EBITDA",1],["ps","Price/sales",1],["fcfy","FCF yield",0],["peg","PEG",1]]},
 {p:"Quality",w:25,fs:[["roe","ROE",0],["roic","ROIC",0],["gm","Gross margin",0],["om","Operating margin",0],["nm","Net margin",0]]},
 {p:"Growth",w:25,fs:[["revG","Revenue growth",0],["epsG","EPS growth",0],["surp","EPS surprise",0],["fepsG","Forward EPS growth",0]]},
 {p:"Health",w:15,fs:[["de","Debt/equity",1],["cr","Current ratio",0],["ic","Interest coverage",0],["fsc","Piotroski F-score",0]]},
 {p:"Yield",w:10,fs:[["shy","Dividend + buyback yield",0]]}];

const mkF=defs=>Object.fromEntries(defs.map(d=>[d.k,{w:d.w,on:true}]));
const CFG={
  tech:{f:mkF(TECH),rsiMin:30,rsiMax:80,above200:false},
  sent:{f:mkF(SENT),minHeads:3,boost:true,shortMode:"avoid"},
  mom:{f:mkF(MOM),volAdj:false,trend:false},
  fund:{pw:Object.fromEntries(FUND.map(p=>[p.p,p.w])),on:Object.fromEntries(FUND.flatMap(p=>p.fs.map(f=>[f[0],true]))),sectorNeutral:true,maxPE:0,maxDE:0,posFCF:false},
  comb:{w:{tech:25,sent:25,mom:25,fund:25},n:10,mode:"weighted",k:3,secCap:3},
  bt:{len:252,freq:5,side:"ls",wt:"equal",bps:10}
};

/* ---------- Agents ---------- */
function techAgent(t){const g=k=>S.map(s=>s.ind[k][t]);const raw={rsi:g("rsi"),macd:g("macd"),sma50:S.map(s=>s.c[t]/s.ind.sma50[t]-1),sma200:S.map(s=>s.c[t]/s.ind.sma200[t]-1),
  golden:S.map(s=>s.ind.sma50[t]>s.ind.sma200[t]?1:0),adx:g("adx"),bb:g("bb"),stoch:g("stoch"),volr:S.map(s=>s.ind.volr[t]*Math.sign(ret(s,t,5))),obv:g("obv"),atr:g("atr"),hi52:g("hi52")};
  const sc={rsi:shaped(raw.rsi,60,30),macd:pct(raw.macd),sma50:pct(raw.sma50),sma200:pct(raw.sma200),golden:raw.golden.map(x=>x*100),adx:pct(raw.adx),bb:shaped(raw.bb,0.75,0.6),
  stoch:shaped(raw.stoch,65,40),volr:pct(raw.volr),obv:pct(raw.obv),atr:pct(raw.atr,1),hi52:pct(raw.hi52)};
  const c=CFG.tech;const score=blend(TECH,c,sc);const pass=S.map((s,i)=>raw.rsi[i]>=c.rsiMin&&raw.rsi[i]<=c.rsiMax&&(!c.above200||raw.sma200[i]>0));
  return{raw,sc,score,pass}}
function sentAgent(t){const heat=sectorHeat(t);const order=Object.entries(heat).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);const top3=new Set(order.slice(0,3));const c=CFG.sent;
  const heads7=S.map(s=>s.cumCnt[t]-s.cumCnt[t-7]);
  const raw={news:S.map(s=>{let a=0,w=0;for(let j=0;j<7;j++){const k=Math.exp(-Math.LN2*j/2);a+=k*s.news[t-j];w+=k}return a/w}),
    buzz:S.map(s=>((s.cumCnt[t]-s.cumCnt[t-3])/3)/(((s.cumCnt[t]-s.cumCnt[t-30])/30)||1)),sector:S.map(s=>heat[s.sec]),ana:S.map(s=>s.ana[t]),soc:S.map(s=>s.soc[t]),ins:S.map(s=>s.ins),short:S.map(s=>s.short)};
  const sc={news:pct(raw.news).map((x,i)=>heads7[i]<c.minHeads?50:x),buzz:pct(raw.buzz),sector:pct(raw.sector),ana:pct(raw.ana),soc:pct(raw.soc),ins:pct(raw.ins),short:pct(raw.short,c.shortMode==="avoid")};
  let score=blend(SENT,c,sc);if(c.boost)score=score.map((x,i)=>Math.min(100,x+(top3.has(S[i].sec)?10:0)));
  return{raw,sc,score,pass:S.map(()=>true),heat,order,heads7}}
function momAgent(t){const c=CFG.mom;const va=(s,v,L,key)=>c.volAdj?v/((s.ind[key][t]||1e-9)*Math.sqrt(L)):v;
  const mR63=S.reduce((a,s)=>a+ret(s,t,63),0)/N;
  const raw={r21:S.map(s=>va(s,ret(s,t,21),21,"sd21")),r63:S.map(s=>va(s,ret(s,t,63),63,"sd63")),r126:S.map(s=>va(s,ret(s,t,126),126,"sd126")),
    r12:S.map(s=>va(s,s.c[t-21]/s.c[t-252]-1,231,"sd252")),rs:S.map(s=>ret(s,t,63)-mR63),acc:S.map(s=>ret(s,t,63)-(s.c[t-63]/s.c[t-126]-1))};
  const sc={};MOM.forEach(d=>sc[d.k]=zsc(raw[d.k]));const score=blend(MOM,c,sc);const pass=S.map(s=>!c.trend||s.c[t]>s.ind.sma200[t]);
  const disp={r21:S.map(s=>ret(s,t,21)),r63:S.map(s=>ret(s,t,63)),r126:S.map(s=>ret(s,t,126)),r12:S.map(s=>s.c[t-21]/s.c[t-252]-1)};
  return{raw,disp,sc,score,pass}}
let fundCache=null;
function fundAgent(){const c=CFG.fund;const key=JSON.stringify(c);if(fundCache&&fundCache.key===key)return fundCache.res;
  const groups=c.sectorNeutral?S.map(s=>s.sec):null;const pill={};let tot=Array(N).fill(0),wsum=0;
  FUND.forEach(P=>{const on=P.fs.filter(f=>c.on[f[0]]);const ps=Array(N).fill(50);if(on.length){const acc=Array(N).fill(0);
      on.forEach(([k,,inv])=>{const vals=S.map(s=>{let v=s.fund[k];if((k==="pe"||k==="fpe"||k==="peg")&&v<=0)v=1e9;return v});pct(vals,inv,groups).forEach((x,i)=>acc[i]+=x)});
      acc.forEach((x,i)=>ps[i]=x/on.length)}
    pill[P.p]=ps;const w=c.pw[P.p];if(w>0&&on.length){wsum+=w;ps.forEach((x,i)=>tot[i]+=w*x)}});
  const score=wsum?tot.map(x=>x/wsum):Array(N).fill(50);
  const pass=S.map(s=>(!c.maxPE||(s.fund.pe>0&&s.fund.pe<=c.maxPE))&&(!c.maxDE||s.fund.de<=c.maxDE)&&(!c.posFCF||s.fund.fcfy>0));
  const res={pill,score,pass};fundCache={key,res};return res}

/* ---------- Combiner ---------- */
function combine(t){const A={tech:techAgent(t),sent:sentAgent(t),mom:momAgent(t),fund:fundAgent()};const c=CFG.comb;
  const ws=c.w.tech+c.w.sent+c.w.mom+c.w.fund||1;
  const comp=S.map((s,i)=>(c.w.tech*A.tech.score[i]+c.w.sent*A.sent.score[i]+c.w.mom*A.mom.score[i]+c.w.fund*A.fund.score[i])/ws);
  const longOK=S.map((s,i)=>A.tech.pass[i]&&A.mom.pass[i]&&A.fund.pass[i]);
  const keys=["tech","sent","mom","fund"];
  const rankOf={};keys.forEach(k=>{const idx=[...Array(N).keys()].sort((a,b)=>A[k].score[b]-A[k].score[a]);const r=new Array(N);idx.forEach((i,p)=>r[i]=p);rankOf[k]=r});
  let candL=[...Array(N).keys()].filter(i=>longOK[i]),candS=[...Array(N).keys()];
  if(c.mode==="consensus"){candL=candL.filter(i=>keys.filter(k=>rankOf[k][i]<20).length>=c.k);candS=candS.filter(i=>keys.filter(k=>rankOf[k][i]>=N-20).length>=c.k)}
  if(c.mode==="hybrid"){candL=candL.filter(i=>keys.every(k=>A[k].score[i]>=40));candS=candS.filter(i=>keys.every(k=>A[k].score[i]<=60))}
  const pick=(cand,desc)=>{cand.sort((a,b)=>desc?comp[b]-comp[a]:comp[a]-comp[b]);const cnt={},out=[];for(const i of cand){if(out.length>=c.n)break;cnt[S[i].sec]=(cnt[S[i].sec]||0);if(c.secCap&&cnt[S[i].sec]>=c.secCap)continue;cnt[S[i].sec]++;out.push(i)}return out};
  const longs=pick(candL,true),lset=new Set(longs);const shorts=pick(candS.filter(i=>!lset.has(i)),false);
  return{A,comp,longs,shorts}}

/* ---------- Formatting ---------- */
const P=(x,d=1)=>isFinite(x)?`<span class="${x>=0?"pos":"neg"}">${x>=0?"+":"−"}${Math.abs(x*100).toFixed(d)}%</span>`:"–";
const N1=(x,d=1)=>isFinite(x)?(x<0?"−":"")+Math.abs(x).toFixed(d):"–";
const SB=x=>`<span class="sb"><span><i style="width:${clamp(x,0,100)}%"></i></span><b>${Math.round(x)}</b></span>`;
function rankTable(rows,cols,failSet){return`<div class="tw"><table><thead><tr><th>#</th><th>Ticker</th><th>Sector</th>${cols.map(c=>`<th>${c[0]}</th>`).join("")}<th>Score</th></tr></thead><tbody>${
  rows.map((i,r)=>`<tr class="${failSet&&!failSet[i]?"fail":""}"><td>${r+1}</td><td class="tk">${S[i].tk}</td><td class="sec">${S[i].sec}</td>${cols.map(c=>`<td>${c[1](i)}</td>`).join("")}<td>${SB(c_score(i))}</td></tr>`).join("")}</tbody></table></div>`}
let c_score=()=>0;
function topBottom(score,pass,n=10){const idx=[...Array(N).keys()];const top=idx.filter(i=>pass[i]).sort((a,b)=>score[b]-score[a]).slice(0,n);const bot=idx.slice().sort((a,b)=>score[a]-score[b]).slice(0,n);return{top,bot}}
function twoTables(title,score,pass,cols,note){c_score=i=>score[i];const{top,bot}=topBottom(score,pass);
  return`<div class="grid2"><div class="card"><h2><span class="dot" style="background:var(--long)"></span>Long candidates, top 10</h2>${rankTable(top,cols)}</div>
  <div class="card"><h2><span class="dot" style="background:var(--short)"></span>Short candidates, bottom 10</h2>${rankTable(bot,cols)}</div></div>${note?`<p class="note">${note}</p>`:""}`}

function factorRows(defs,cfg){const tot=defs.reduce((a,d)=>a+(cfg.f[d.k].on?cfg.f[d.k].w:0),0)||1;

/* ---------- Backtest ---------- */
function backtest(){const c=CFG.bt;const start=D-1-c.len;let w=new Map(),nav=1,bnav=1;const navs=[1],bnavs=[1],dates=[DATES[start]],rets=[],brets=[],trades=[];let turn=[],last=null;
  for(let t=start;t<D-1;t++){
    if((t-start)%c.freq===0){const r=combine(t);const nw=new Map();const add=(arr,sgn)=>{if(!arr.length)return;let ws=arr.map(i=>c.wt==="score"?Math.max(1,sgn>0?r.comp[i]-50:50-r.comp[i]):1);const s=ws.reduce((a,b)=>a+b,0);arr.forEach((i,j)=>nw.set(i,sgn*ws[j]/s))};
      add(r.longs,1);if(c.side==="ls")add(r.shorts,-1);
      let to=0;const keys=new Set([...w.keys(),...nw.keys()]);keys.forEach(i=>{const a=w.get(i)||0,b=nw.get(i)||0;to+=Math.abs(b-a);
        if(a===0&&b!==0)trades.push([t,i,b>0?"Buy":"Short",r.comp[i]]);else if(a!==0&&b===0)trades.push([t,i,a>0?"Sell":"Cover",r.comp[i]]);});
      turn.push(to);nav*=1-to*c.bps/1e4;w=nw;last={t,r,w:nw}}
    let pr=0,gs=0;w.forEach((x,i)=>{pr+=x*S[i].r[t+1];if(x<0)gs-=x});pr-=gs*0.005/252;
    nav*=1+pr;bnav*=1+MKT[t+1];rets.push(pr);brets.push(MKT[t+1]);navs.push(nav);bnavs.push(bnav);dates.push(DATES[t+1])}
  return{navs,bnavs,dates,rets,brets,trades,turn,last}}
function stats(rets,navs,brets){const n=rets.length,m=rets.reduce((a,b)=>a+b,0)/n,sd=Math.sqrt(rets.reduce((a,b)=>a+(b-m)**2,0)/n)||1e-9;
  const dd=Math.sqrt(rets.reduce((a,b)=>a+Math.min(b,0)**2,0)/n)||1e-9;let pk=1,mdd=0;navs.forEach(v=>{pk=Math.max(pk,v);mdd=Math.min(mdd,v/pk-1)});
  const cagr=navs[navs.length-1]**(252/n)-1;let beta=NaN;if(brets){const bm=brets.reduce((a,b)=>a+b,0)/n;let cv=0,vv=0;for(let i=0;i<n;i++){cv+=(rets[i]-m)*(brets[i]-bm);vv+=(brets[i]-bm)**2}beta=cv/vv}
  return{cagr,vol:sd*Math.sqrt(252),sharpe:m/sd*Math.sqrt(252),sortino:m/dd*Math.sqrt(252),mdd,calmar:mdd?cagr/-mdd:NaN,win:rets.filter(x=>x>0).length/n,beta,total:navs[navs.length-1]-1}}
function lineChart(series,dates,fmt,area){const W=820,H=250,pl=52,pr=12,pt=10,pb=26,n=dates.length;const all=series.flatMap(s=>s.v);let mn=Math.min(...all),mx=Math.max(...all);if(area)mx=0;const pad=(mx-mn)*0.06||0.01;mn-=pad;if(!area)mx+=pad;
  const x=i=>pl+(W-pl-pr)*i/(n-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));let g="";for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--soft)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  [0,Math.floor(n/2),n-1].forEach((i,j)=>g+=`<text x="${x(i)}" y="${H-6}" text-anchor="${["start","middle","end"][j]}">${fmtDate(dates[i])}</text>`);
  series.forEach(s=>{const pts=s.v.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");g+=area?`<polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="${s.c}" fill-opacity=".25" stroke="${s.c}" stroke-width="1.2"/>`:`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="${s.wd||2}"/>`});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${series.map(s=>s.l).join(" vs ")}">${g}</svg>`}
function renderBT(b){const s=stats(b.rets,b.navs,b.brets),bs=stats(b.brets,b.bnavs);const dd=v=>{let pk=1;return v.map(x=>{pk=Math.max(pk,x);return x/pk-1})};
  const pf=v=>(v>=0?"+":"−")+Math.abs(v*100).toFixed(1)+"%";const M=(l,a,bm)=>`<div class="m"><small>${l}</small><strong>${a}</strong><em>Benchmark ${bm}</em></div>`;
  const L=b.last;const hold=[...L.w.entries()].sort((a,b)=>b[1]-a[1]);
  view.innerHTML=`<p class="lead">Strategy returned ${pf(s.total)} versus ${pf(bs.total)} for the equal-weight benchmark from ${fmtDate(b.dates[0])} to ${fmtDate(b.dates[b.dates.length-1])}.</p>
  <div class="metrics">${M("CAGR",pf(s.cagr),pf(bs.cagr))}${M("Sharpe",s.sharpe.toFixed(2),bs.sharpe.toFixed(2))}${M("Sortino",s.sortino.toFixed(2),bs.sortino.toFixed(2))}${M("Max drawdown",pf(s.mdd),pf(bs.mdd))}${M("Volatility",pf(s.vol).replace("+",""),pf(bs.vol).replace("+",""))}${M("Calmar",N1(s.calmar,2),N1(bs.calmar,2))}${M("Up days",Math.round(s.win*100)+"%",Math.round(bs.win*100)+"%")}${M("Beta / turnover",N1(s.beta,2)+" / "+Math.round(100*b.turn.reduce((a,x)=>a+x,0)/b.turn.length)+"%","1.00")}</div>
  <div class="stack"><div class="card"><h2>Growth of $1</h2>${lineChart([{v:b.bnavs,c:"var(--bench)",l:"Benchmark",wd:1.5},{v:b.navs,c:"var(--accent)",l:"Strategy"}],b.dates,v=>"$"+v.toFixed(2))}<div class="legend"><span style="--c:var(--accent)">Strategy</span><span style="--c:var(--bench)">Equal-weight benchmark</span></div></div>
  <div class="card"><h2>Drawdown</h2>${lineChart([{v:dd(b.navs),c:"var(--short)",l:"Strategy drawdown"}],b.dates,v=>Math.round(v*100)+"%",true)}</div>
  <div class="grid2"><div class="card"><h2>Holdings after last rebalance, ${fmtDate(DATES[L.t+1])}</h2><div class="tw"><table><thead><tr><th>#</th><th>Ticker</th><th>Side</th><th>Weight</th><th>Composite</th></tr></thead><tbody>${hold.map(([i,x],n)=>`<tr><td>${n+1}</td><td class="tk">${S[i].tk}</td><td>${x>0?'<span class="pos">Long</span>':'<span class="neg">Short</span>'}</td><td>${N1(x*100,1)}%</td><td>${SB(L.r.comp[i])}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><h2>Trade log, latest 40</h2><div class="tw"><table><thead><tr><th>Date</th><th>Ticker</th><th>Action</th><th>Composite</th></tr></thead><tbody>${b.trades.slice(-40).reverse().map(([t,i,a,cs])=>`<tr><td>${fmtDate(DATES[t])}</td><td class="tk">${S[i].tk}</td><td class="${a==="Buy"||a==="Cover"?"pos":"neg"}">${a}</td><td>${Math.round(cs)}</td></tr>`).join("")}</tbody></table></div></div></div></div>
  <p class="note">Results come from simulated prices and are only a check that the pipeline works. They say nothing about real stocks.</p>`}

/* ---------- Tabs ---------- */
let current="comb";const tabs=document.getElementById("tabs");
const ORDER=["tech","sent","mom","fund","comb","bt"];
function drawTabs(){tabs.innerHTML=ORDER.map(k=>`<button role="tab" aria-selected="${k===current}" data-t="${k}">${VIEWS[k].name}</button>`).join("");tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>show(b.dataset.t))}
function show(k){current=k;drawTabs();VIEWS[k].side();VIEWS[k].main();try{history.replaceState(null,"","#"+k)}catch(e){}}
let rq=null;function refresh(){cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{if(current!=="bt"){VIEWS[current].main();const v=document.activeElement;side.querySelectorAll(".frow").forEach(r=>{})
  if(CFG[current]&&CFG[current].f){const defs={tech:TECH,sent:SENT,mom:MOM}[current];const tot=defs.reduce((a,d)=>a+(CFG[current].f[d.k].on?CFG[current].f[d.k].w:0),0)||1;
    defs.forEach(d=>{const el=side.querySelector(`[data-w="${d.k}"]`);if(!el)return;const row=el.parentElement,c=CFG[current].f[d.k];row.classList.toggle("off",!c.on);row.querySelector(".pct").textContent=(c.on?Math.round(100*c.w/tot):0)+"%"})}}})}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(ORDER.includes(h)&&h!==current)show(h)});
const h0=location.hash.slice(1);show(ORDER.includes(h0)?h0:"comb");
</script>
